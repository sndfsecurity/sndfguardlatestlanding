<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thank You - SNDF Security</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>

body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  background: linear-gradient(135deg, #0f172a, #1e293b);
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  color: white;
}

.container {
  text-align: center;
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(12px);
  padding: 50px 30px;
  border-radius: 20px;
  box-shadow: 0 10px 40px rgba(0,0,0,0.3);
  max-width: 400px;
  width: 90%;
}

.icon {
  font-size: 50px;
  color: #22c55e;
  margin-bottom: 15px;
}

h1 {
  font-size: 32px;
  margin-bottom: 10px;
}

p {
  font-size: 16px;
  opacity: 0.8;
}

.btn {
  display: inline-block;
  margin-top: 25px;
  padding: 12px 25px;
  background: #22c55e;
  color: black;
  font-weight: 600;
  border-radius: 8px;
  text-decoration: none;
  transition: 0.3s;
}

.btn:hover {
  background: #16a34a;
  transform: scale(1.05);
}

</style>
</head>

<body>

<div class="container">

  <div class="icon">✔</div>

  <h1>Thank You!</h1>
  <p>We will contact you within 2 hours.</p>

  <a href="/" class="btn">Back to Home</a>

</div>

</body>
</html>
